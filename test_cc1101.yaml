# Test configuration for CC1101 support
# This file is for testing purposes only

substitutions:
  name: "wmbus-cc1101-test"
  friendly_name: "WMBus CC1101 Test"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    upload_speed: 921600

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  id: component_logger
  level: DEBUG
  baud_rate: 115200

wifi:
  ap:

time:
  - platform: homeassistant

api:

ota:
  - platform: esphome

web_server:
  version: 3

# SPI configuration
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# CC1101 WMBus Radio configuration
wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO2
  reset_pin: GPIO2      # CS pin also used as reset
  irq_pin: GPIO5        # GDO0
  gdo0_pin: GPIO5       # GDO0 - FIFO threshold
  gdo2_pin: GPIO4       # GDO2 - Sync detection
  frequency: 868.95
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm T: %s (%d) %s"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size(), toString(frame->link_mode()) ]

# Example meter configuration
wmbus_meter:
  - id: test_meter
    meter_id: 0x12345678
    type: apator162
    key: "00000000000000000000000000000000"
    mode: 
      - T1
      - C1

sensor:
  - platform: wmbus_meter
    parent_id: test_meter
    field: total_m3
    name: "Water Total"
    accuracy_decimals: 3
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing

  - platform: wmbus_meter
    parent_id: test_meter
    field: rssi_dbm
    name: "Meter RSSI"
    accuracy_decimals: 0
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
